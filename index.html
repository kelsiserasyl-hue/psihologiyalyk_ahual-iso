<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Изопроцестер: көңіл-күй манометрі</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700;800&display=swap">
<style>
:root{--bg1:#0f1d3d;--bg2:#1c2f63;--ink:#eef3ff;--soft:#a9b8e0;--gold:#ffd77a;--aqua:#7be7e0;--card:rgba(255,255,255,.07);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans",system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 30%,var(--bg2),var(--bg1) 70%) fixed;display:flex;flex-direction:column;align-items:center;padding:20px 14px 28px;overflow-x:hidden}
h1{font-size:clamp(20px,4.4vw,32px);font-weight:800;margin:6px 0 4px;text-align:center;letter-spacing:.2px}
.sub{margin:0;color:var(--soft);text-align:center;font-size:clamp(13px,2.6vw,16px);max-width:560px}
.value{margin:12px 0 0;padding:6px 16px;border-radius:99px;background:var(--card);border:1px solid rgba(255,215,122,.45);color:var(--gold);font-weight:700;font-size:14px}
.stage{position:relative;width:min(94vw,620px);aspect-ratio:1;margin:8px auto 0;perspective:900px}
.gauge{position:absolute;left:27%;top:27%;width:46%;aspect-ratio:1;border-radius:50%;transition:transform .15s;transform-style:preserve-3d;
background:conic-gradient(from 30deg,#f6e3b0,#8a6a2b,#fff0c4,#7a5c22,#f6e3b0);padding:5%;box-shadow:0 30px 50px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.08),0 0 60px var(--glow,rgba(123,231,224,.15))}
.gauge .dial{position:relative;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#1d2c5a,#0a1230 75%);box-shadow:inset 0 8px 22px rgba(0,0,0,.7)}
.gauge svg{width:100%;height:100%;display:block}
.glass{position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 35% 18%,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
#needle{transform-box:view-box;transform-origin:50% 50%;transition:transform 1.3s cubic-bezier(.3,1.5,.5,1)}
.orb{position:absolute;width:17%;aspect-ratio:1;min-width:58px;transform:translate(-50%,-50%);border:0;padding:0;background:none;cursor:pointer;color:#fff;font:inherit;animation:bob 4s ease-in-out infinite}
.orb:focus-visible{outline:3px solid var(--gold);outline-offset:6px;border-radius:50%}
.ball{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:50%;position:relative;transition:transform .25s,filter .4s;
background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75),rgba(255,255,255,0) 32%),radial-gradient(circle at 40% 35%,var(--c1),var(--c2) 70%,var(--c3));
box-shadow:inset -8px -12px 20px rgba(0,0,0,.35),inset 4px 6px 12px rgba(255,255,255,.25),0 16px 24px rgba(0,0,0,.45)}
.orb:hover .ball{transform:scale(1.1) translateY(-3px)}
.orb:active .ball{transform:scale(.95)}
.ball svg{width:46%;height:46%;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.cap{display:block;margin-top:8px;font-size:clamp(11px,2.3vw,13px);font-weight:700;color:var(--soft);text-align:center;white-space:nowrap;position:absolute;left:50%;transform:translateX(-50%)}
.orb.done{animation:none}
.orb.done .ball{filter:saturate(.75) brightness(.92);box-shadow:inset -8px -12px 20px rgba(0,0,0,.35),0 0 0 3px var(--gold),0 0 26px rgba(255,215,122,.6)}
.orb.done .cap{color:var(--gold)}
.orb.done::after{content:"✓";position:absolute;right:-2px;top:-2px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#3a2a00;font-size:13px;font-weight:800;display:grid;place-items:center}
@keyframes bob{50%{transform:translate(-50%,calc(-50% - 5px))}}
.card{width:min(94vw,620px);margin-top:16px;padding:16px 20px;border-radius:18px;background:var(--card);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);min-height:104px}
.card b{display:block;color:var(--aqua);margin-bottom:4px;font-size:14px}
.card p{margin:0;font-size:clamp(15px,3.2vw,18px);line-height:1.55}
.bar{display:flex;justify-content:space-between;align-items:center;width:min(94vw,620px);margin-top:12px;color:var(--soft);font-size:14px}
button.reset{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:7px 16px;cursor:pointer}
button.reset:hover{background:var(--card)}
button.reset:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.card.pop{animation:pop .7s ease-out}@keyframes pop{0%{box-shadow:0 0 0 0 rgba(255,215,122,.8);border-color:var(--gold)}100%{box-shadow:0 0 0 20px rgba(255,215,122,0)}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){.orb{animation:none}#needle{transition:none}}
</style>
</head>
<body>
<h1>Изопроцестер: көңіл-күй манометрі</h1>
<p class="sub">Шарларды бір-бірлеп бас: хабарлама ашылады, манометрдегі көңіл-күй қысымы көтеріледі.</p>
<div class="value">Құндылық: Әділдік және жауапкершілік</div>

<div class="card" aria-live="polite"><b id="ct">Бастайық</b><p id="cp">Кез келген шарды бас. Әр шарда изопроцесс пен сабақтың құндылығы жасырылған.</p></div>
<div class="stage" id="stage">
  <div class="gauge" id="gauge"><div class="dial">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <g id="zones" fill="none" stroke-width="6" stroke-linecap="butt"></g>
      <g id="ticks" stroke="#cfd9ff"></g>
      <g id="nums" fill="#cfd9ff" font-size="10" font-weight="700" text-anchor="middle"></g>
      <text x="100" y="138" fill="#a9b8e0" font-size="8.5" font-weight="700" text-anchor="middle">Көңіл-күй қысымы</text>
      <text x="100" y="150" fill="#ffd77a" font-size="8" font-weight="700" text-anchor="middle">бар</text>
      <g id="needle"><path d="M97.5 104 L100 34 L102.5 104Z" fill="#ffd77a"/><path d="M100 104 L100 120" stroke="#ffd77a" stroke-width="4"/></g>
      <circle cx="100" cy="100" r="8" fill="#8a6a2b"/><circle cx="100" cy="100" r="4" fill="#fff0c4"/>
    </svg>
    <div class="glass"></div>
  </div></div>
</div>

<div class="bar"><span id="count" role="status">Ашылған хабарлама: 0 / 6</span><button class="reset" id="reset" type="button">Қайта бастау</button></div>
<canvas id="fx"></canvas>

<script>
(function(){
var N=6,opened=0;
var D=[
{n:"Изотерма",c:["#ff9bd0","#c2418f","#6d1b58"],g:'<path d="M10 4a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z"/><path d="M12 9v7"/>',t:"Изотермиялық процесс: T = const",m:"Температура өзгермесе де, көлем азайған сайын қысым артады. Сен де қиындықта өзгермей, әділ шешім қабылдай аласың. Өз таңдауыңның салмағын көтеруге қауқарың жетеді!"},
{n:"Изобара",c:["#8ff0ea","#1f9fa0","#0b5560"],g:'<ellipse cx="12" cy="10" rx="6" ry="7.5"/><path d="M12 17.5l-1.6 2.5h3.2z"/><path d="M12 20c0 1.5 1 2 1 3"/>',t:"Изобаралық процесс: p = const",m:"Қысым тұрақты болса, газ қызған сайын кеңейеді. Сен де осылай өс: жауапкершілік алған сайын мүмкіндігің кеңейе түседі. Бүгін бір қадам алға шық!"},
{n:"Изохора",c:["#ffe39a","#e0a020","#8a5a05"],g:'<rect x="5" y="5" width="14" height="14" rx="2.5"/><path d="M5 9.5h14"/><circle cx="10" cy="14.5" r="1"/><circle cx="14.5" cy="15.5" r="1"/>',t:"Изохоралық процесс: V = const",m:"Көлем өзгермесе де, қыздырған сайын қысым артады. Сенің ішкі қуатың да осылай жиналады. Оны әділдікке және жауапты істерге жұмса!"},
{n:"Молекулалар",c:["#b9a8ff","#6b52d9","#33217f"],g:'<circle cx="7" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><circle cx="11" cy="17" r="3.2"/><path d="M9.5 9.5l.8 4.5M14.5 10.5l-2 4.5"/>',t:"Газ молекулалары",m:"Әр молекула маңызды: біреуі болмаса, қысым өзгереді. Сен де сыныптың маңызды бөлігісің. Әділ бол, өз үлесіңді қос!"},
{n:"Поршень",c:["#9fd0ff","#3a7fe0","#17387f"],g:'<rect x="8" y="2.5" width="8" height="3.5" rx="1"/><path d="M12 6v7"/><rect x="5" y="13" width="14" height="8" rx="1.8"/>',t:"Поршень мен қысым",m:"Поршень сыққан сайын газ қарсы тұрады. Сен де қиындыққа берілме: жауапкершілікпен әрекет ете біл, нәтиже міндетті түрде келеді!"},
{n:"Тепе-теңдік",c:["#ffb48f","#e25f3a","#7d2410"],g:'<path d="M12 4v16M7 20h10M5 7.5h14"/><path d="M5 7.5l-3 6h6zM19 7.5l-3 6h6z"/>',t:"Тепе-теңдік күйі",m:"Тепе-теңдікте екі жақ тең. Әр сыныптасыңа бірдей қара, өз сөзіңе жауап бер, сонда сыныптың тепе-теңдігі сенің қолыңда болады!"}
];
var FIN="Көңіл-күй қысымы жоғары деңгейге жетті! Бүгін сабақта әділ боламыз, жауапкершілікпен жұмыс істейміз және бірге жаңа заңдарды ашамыз.";
var st=document.getElementById("stage"),needle=document.getElementById("needle"),gauge=document.getElementById("gauge");
var ct=document.getElementById("ct"),cp=document.getElementById("cp"),cnt=document.getElementById("count");
var NS="http://www.w3.org/2000/svg";
function P(r,a){var t=a*Math.PI/180;return [100+r*Math.sin(t),100-r*Math.cos(t)]}
function arc(r,a1,a2,col){var s=P(r,a1),e=P(r,a2),p=document.createElementNS(NS,"path");p.setAttribute("d","M"+s[0]+" "+s[1]+"A"+r+" "+r+" 0 "+(a2-a1>180?1:0)+" 1 "+e[0]+" "+e[1]);p.setAttribute("stroke",col);return p}
var Z=document.getElementById("zones");
Z.appendChild(arc(76,-120,-40,"#4fb7ff"));Z.appendChild(arc(76,-40,40,"#7be7e0"));Z.appendChild(arc(76,40,120,"#ffd77a"));
var T=document.getElementById("ticks"),M=document.getElementById("nums");
for(var i=0;i<=30;i++){var a=-120+8*i,maj=i%5===0,p1=P(maj?64:67,a),p2=P(71,a),l=document.createElementNS(NS,"line");
l.setAttribute("x1",p1[0]);l.setAttribute("y1",p1[1]);l.setAttribute("x2",p2[0]);l.setAttribute("y2",p2[1]);l.setAttribute("stroke-width",maj?2:1);T.appendChild(l);
if(maj){var q=P(54,a),tx=document.createElementNS(NS,"text");tx.setAttribute("x",q[0]);tx.setAttribute("y",q[1]+3.5);tx.textContent=i/5;M.appendChild(tx)}}
function setNeedle(v){needle.style.transform="rotate("+(-120+240*v/N)+"deg)";gauge.style.setProperty("--glow","rgba(255,215,122,"+(0.12+0.5*v/N)+")")}
setNeedle(0);

var orbs=[];
D.forEach(function(d,i){
  var a=(-90+60*i)*Math.PI/180,b=document.createElement("button");
  b.type="button";b.className="orb";b.setAttribute("aria-label",d.n+": хабарламаны ашу");
  b.style.left=(50+40*Math.cos(a))+"%";b.style.top=(50+40*Math.sin(a))+"%";b.style.animationDelay=(i*.5)+"s";
  b.style.setProperty("--c1",d.c[0]);b.style.setProperty("--c2",d.c[1]);b.style.setProperty("--c3",d.c[2]);
  b.innerHTML='<span class="ball"><svg viewBox="0 0 24 24" aria-hidden="true">'+d.g+'</svg></span><span class="cap" style="top:100%">'+d.n+'</span>';
  b.addEventListener("click",function(e){open(b,d,e)});
  st.appendChild(b);orbs.push(b);
});
function pop(){var c=document.querySelector(".card");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop")}
function open(b,d,e){
  var r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  ct.textContent=d.t;cp.textContent=d.m;pop();
  dust(x,y,b.classList.contains("done")?18:46);
  if(!b.classList.contains("done")){
    b.classList.add("done");opened++;setNeedle(opened);
    cnt.textContent="Ашылған хабарлама: "+opened+" / "+N;
    if(opened===N){setTimeout(function(){
      var g=gauge.getBoundingClientRect();ct.textContent="Манометр ең жоғары белгіде";cp.textContent=FIN;pop();
      dust(g.left+g.width/2,g.top+g.height/2,140);setTimeout(function(){dust(g.left+g.width/2,g.top+g.height*.3,90)},350)},700)}
  }
}
document.getElementById("reset").addEventListener("click",function(){
  opened=0;setNeedle(0);orbs.forEach(function(o){o.classList.remove("done")});
  cnt.textContent="Ашылған хабарлама: 0 / "+N;ct.textContent="Бастайық";
  cp.textContent="Кез келген шарды бас. Әр шарда изопроцесс пен сабақтың құндылығы жасырылған."});

/* 3D tilt */
var rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
if(!rm)st.addEventListener("pointermove",function(e){var r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  gauge.style.transform="rotateY("+(x*14)+"deg) rotateX("+(-y*14)+"deg)"});
st.addEventListener("pointerleave",function(){gauge.style.transform=""});

/* magic dust */
var cv=document.getElementById("fx"),cx=cv.getContext("2d"),ps=[],run=false,col=["#ffd77a","#7be7e0","#ffffff","#ffe9b0","#b9a8ff"];
function rs(){var k=devicePixelRatio||1;cv.width=innerWidth*k;cv.height=innerHeight*k;cx.setTransform(k,0,0,k,0,0)}
rs();addEventListener("resize",rs);
function star(x,y,s){cx.beginPath();for(var i=0;i<8;i++){var a=i*Math.PI/4,r=i%2?s*.35:s;cx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}cx.closePath();cx.fill()}
function dust(x,y,n){if(rm)n=Math.min(n,12);
  for(var i=0;i<n;i++){var a=Math.random()*6.283,v=1.5+Math.random()*(n>100?7:4.5);
    ps.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,s:2+Math.random()*5,l:1,d:.012+Math.random()*.014,c:col[i%col.length],st:Math.random()<.4})}
  if(!run){run=true;requestAnimationFrame(loop)}}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);
  ps=ps.filter(function(p){return p.l>0});
  ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+.07;p.l-=p.d;
    cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=10;
    if(p.st)star(p.x,p.y,p.s*1.6);else{cx.beginPath();cx.arc(p.x,p.y,p.s*.6,0,6.283);cx.fill()}});
  cx.globalAlpha=1;cx.shadowBlur=0;
  if(ps.length)requestAnimationFrame(loop);else run=false}
})();
</script>
</body>
</html>
